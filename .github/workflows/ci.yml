name: VKU Field Survey App - CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-build:
    name: Test & Build Verification
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout repository
        uses: actions/checkout@v4

      - name: 2. Setup Node.js environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 3. Install dependencies
        run: npm ci

      - name: 4. Run automated testcases (Vitest)
        run: npm test

      - name: 5. Build production bundle (Vite)
        run: npm run build

      - name: 6. Verify PWA core artifacts
        run: |
          test -f dist/index.html || exit 1
          test -f dist/sw.js || exit 1
          test -f dist/manifest.webmanifest || exit 1
          echo "All PWA App Shell and Service Worker assets verified successfully!"
