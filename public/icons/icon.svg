<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="gradVKU" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#003366" />
      <stop offset="50%" stop-color="#0A4C8B" />
      <stop offset="100%" stop-color="#F26522" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF8A44" />
      <stop offset="100%" stop-color="#F26522" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Background with rounded corners -->
  <rect width="512" height="512" rx="112" fill="url(#gradVKU)" />

  <!-- Outer Ring / Target Circle (Survey Theme) -->
  <circle cx="256" cy="256" r="190" stroke="rgba(255,255,255,0.15)" stroke-width="4" fill="none" />
  <circle cx="256" cy="256" r="140" stroke="rgba(255,255,255,0.2)" stroke-width="2" stroke-dasharray="8 8" fill="none" />

  <!-- Clipboard Background -->
  <g filter="url(#shadow)">
    <rect x="146" y="110" width="220" height="290" rx="24" fill="#FFFFFF" />
    
    <!-- Clipboard Clip -->
    <rect x="206" y="88" width="100" height="40" rx="12" fill="url(#accentGrad)" />
    <circle cx="256" cy="108" r="8" fill="#FFFFFF" />

    <!-- Form Lines / Checkmarks -->
    <rect x="180" y="165" width="152" height="12" rx="6" fill="#E2E8F0" />
    <rect x="180" y="195" width="110" height="12" rx="6" fill="#E2E8F0" />
    
    <!-- Checkbox 1 (Checked) -->
    <rect x="180" y="235" width="24" height="24" rx="6" fill="#10B981" />
    <path d="M187 247 L193 253 L201 241" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    <rect x="216" y="241" width="116" height="12" rx="6" fill="#64748B" />

    <!-- Checkbox 2 (Checked) -->
    <rect x="180" y="280" width="24" height="24" rx="6" fill="#10B981" />
    <path d="M187 292 L193 298 L201 286" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    <rect x="216" y="286" width="90" height="12" rx="6" fill="#64748B" />

    <!-- Pin / Camera Badge (Field Inspection) -->
    <g transform="translate(290, 310)">
      <circle cx="50" cy="50" r="42" fill="url(#accentGrad)" />
      <!-- Pin / Inspection Icon -->
      <path d="M50 25 C39 25 30 34 30 45 C30 58 46 72 50 75 C54 72 70 58 70 45 C70 34 61 25 50 25 Z" fill="#FFFFFF" />
      <circle cx="50" cy="43" r="7" fill="#F26522" />
    </g>
  </g>

  <!-- VKU Text Badge at Bottom -->
  <text x="256" y="450" text-anchor="middle" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="28" letter-spacing="4">VKU SURVEY</text>
</svg>
