<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>VKU Field Survey - Khảo Sát Cơ Sở Vật Chất</title>
    
    <!-- PWA Meta Tags -->
    <meta name="description" content="Ứng dụng khảo sát hiện trường cơ sở vật chất VKU Offline-First chuẩn PWA" />
    <meta name="theme-color" content="#003366" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="VKU Survey" />
    <meta name="format-detection" content="telephone=no" />

    <!-- Favicon & PWA Icons -->
    <link rel="icon" type="image/svg+xml" href="/icons/icon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <!-- Stylesheets -->
    <script type="module" crossorigin src="/assets/index-D4qfY1n4.js"></script>
    <link rel="stylesheet" crossorigin href="/assets/index-l3hMj25Z.css">
  </head>
  <body>
    <div class="app-container">
      <!-- Header chính -->
      <header class="app-header">
        <div class="brand-section">
          <img src="/icons/icon.svg" alt="VKU Logo" class="brand-logo" />
          <div class="brand-title-group">
            <h1>VKU Field Survey</h1>
            <div class="brand-subtitle">Khảo sát Cơ sở Vật chất VKU</div>
          </div>
        </div>

        <div class="header-actions">
          <!-- Huy hiệu trạng thái mạng -->
          <div id="header-network-badge" class="network-badge online">
            <span class="status-dot"></span>
            <span id="header-network-text">Online</span>
          </div>

          <!-- Nút Cài đặt App PWA -->
          <button id="btn-install-pwa" class="btn-pwa-install" title="Cài đặt lên màn hình chính">
            📲 Cài đặt
          </button>
        </div>
      </header>

      <!-- Dải băng cảnh báo Ngoại tuyến -->
      <div id="offline-banner" class="offline-banner">
        <span>📴 Bạn đang ở chế độ <b>Offline</b>. Dữ liệu sẽ lưu vào IndexedDB và tự động đồng bộ khi có mạng.</span>
      </div>

      <!-- Khu vực nội dung các Tab -->
      <main class="app-main" style="flex: 1;">
        <!-- Tab 1: Khảo sát mới -->
        <section id="tab-new" class="tab-content active"></section>

        <!-- Tab 2: Lịch sử khảo sát -->
        <section id="tab-history" class="tab-content"></section>

        <!-- Tab 3: Hàng đợi & Đồng bộ -->
        <section id="tab-sync" class="tab-content"></section>

        <!-- Tab 4: Giới thiệu & Báo cáo kỹ thuật -->
        <section id="tab-about" class="tab-content"></section>
      </main>

      <!-- Bottom Navigation Bar -->
      <nav class="bottom-nav">
        <button class="nav-item active" data-tab="tab-new">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
            <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path>
            <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path>
          </svg>
          <span class="nav-label">Khảo sát</span>
        </button>

        <button class="nav-item" data-tab="tab-history">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
            <line x1="8" y1="6" x2="21" y2="6"></line>
            <line x1="8" y1="12" x2="21" y2="12"></line>
            <line x1="8" y1="18" x2="21" y2="18"></line>
            <line x1="3" y1="6" x2="3.01" y2="6"></line>
            <line x1="3" y1="12" x2="3.01" y2="12"></line>
            <line x1="3" y1="18" x2="3.01" y2="18"></line>
          </svg>
          <span class="nav-label">Lịch sử</span>
        </button>

        <button class="nav-item" data-tab="tab-sync">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
            <polyline points="23 4 23 10 17 10"></polyline>
            <polyline points="1 20 1 14 7 14"></polyline>
            <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path>
          </svg>
          <span class="nav-label">Đồng bộ</span>
          <span id="nav-sync-badge" class="nav-badge">0</span>
        </button>

        <button class="nav-item" data-tab="tab-about">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
            <circle cx="12" cy="12" r="10"></circle>
            <line x1="12" y1="16" x2="12" y2="12"></line>
            <line x1="12" y1="8" x2="12.01" y2="8"></line>
          </svg>
          <span class="nav-label">Kỹ thuật</span>
        </button>
      </nav>
    </div>

    <!-- Modal Chi tiết Phiếu -->
    <div id="detail-modal" class="modal-overlay">
      <div class="modal-dialog">
        <div class="modal-header">
          <h3 class="modal-title">Chi Tiết Phiếu Khảo Sát</h3>
          <button class="modal-close" title="Đóng">&times;</button>
        </div>
        <div class="modal-body"></div>
      </div>
    </div>

    <!-- Container Toast Notifications -->
    <div id="toast-container" class="toast-container"></div>

    <!-- Main JavaScript Module -->
  </body>
</html>
